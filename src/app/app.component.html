<div class="app-shell" [class.rtl-mode]="i18n.isRtl()">
  
  <app-navbar></app-navbar>

  <app-toast></app-toast>

  <div class="app-body" [class.has-sidebar]="showSidebar()">
    
    @if (showSidebar()) {
      <app-sidebar></app-sidebar>
    }

    <main class="main-content" [class.full-width]="!showSidebar()">
      <router-outlet></router-outlet>
    </main>

  </div>

  <footer class="app-footer glass-panel">
    <div class="footer-inner">
      <div class="footer-brand">
        <span class="brand-text">Volt<strong>TN</strong> — تونس</span>
        <span class="sep">•</span>
        <span class="footer-sub">Plateforme Intelligente de Gestion de l'Électricité</span>
      </div>
      <div class="footer-meta">
        <span>© 2025 VoltTN • Tous droits réservés</span>
        <span class="sep">•</span>
        <span class="status-indicator">
          <span class="dot-online"></span>
          <span>Système Connecté & Opérationnel</span>
        </span>
      </div>
    </div>
  </footer>

</div>
